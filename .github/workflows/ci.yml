name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://financeflow:financeflow@localhost:5432/financeflow?schema=public
  JWT_ACCESS_SECRET: ci-access-secret
  JWT_REFRESH_SECRET: ci-refresh-secret
  WEB_ORIGIN: http://localhost:5173

jobs:
  quality:
    name: Lint, build e testes
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: financeflow
          POSTGRES_PASSWORD: financeflow
          POSTGRES_DB: financeflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U financeflow"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run prisma:generate -w @financeflow/api
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Testes e2e da API (com banco)
        run: npm run test:e2e -w @financeflow/api

  e2e-web:
    name: Fluxos no navegador (Playwright)
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: financeflow
          POSTGRES_PASSWORD: financeflow
          POSTGRES_DB: financeflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U financeflow"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build -w @financeflow/shared
      - run: npm run prisma:generate -w @financeflow/api
      - run: npx prisma migrate deploy
        working-directory: apps/api
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Playwright (sobe API e web automaticamente)
        run: npm run test:e2e -w @financeflow/web
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  docker:
    name: Imagens Docker
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: ., file: apps/api/Dockerfile, push: false, cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - uses: docker/build-push-action@v6
        with: { context: ., file: apps/web/Dockerfile, push: false, cache-from: type=gha, cache-to: "type=gha,mode=max" }
